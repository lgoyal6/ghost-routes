[project]
name = "ghost-routes"
version = "0.1.0"
description = "Verify pedestrian access through construction phases, overlapping projects and plan revisions."
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "geoalchemy2>=0.16",
  "psycopg[binary]>=3.2",
  "networkx>=3.4",
  "shapely>=2.0.6",
  "ortools>=9.11",
  "pdfplumber>=0.11.4",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "httpx>=0.28",
  "typer>=0.15",
  "python-multipart>=0.0.18",
]

[project.scripts]
ghost-routes = "ghost_routes.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghost_routes"]
